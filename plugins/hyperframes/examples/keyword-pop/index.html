<!doctype html>
<!-- A spoken phrase as type over footage: a small serif lead-in, then the keyword slams in big and bold on its word.
     Transparent, 1080×1920, 2.4 s. The brand's mascot, when the project has one, stands on the keyword's top-left. Raw material: change fonts, colours, sizes, motion and timing for the video. -->
<!-- Pitfalls:
  - The keyword stays on one line and shrinks to fit the 960 px width: at size 150 about 12 characters fit at full
    size ("Best weekend"); "Cheapest flights" (16) drops to ~115 px, 24 characters to ~75 px. Below ~90 px it stops
    reading as a pop: past 2 × size / 3 it wraps to two lines instead. Pick a shorter keyword and move the rest of
    the phrase into lead.
  - The lead-in overlaps the keyword's top by 18 px: a tall Vietnamese mark under its right end ("Nguyễn" with lead
    "one of the") touches it. Keep the lead short or put the marked word first.
  - The keyword's bottom sits ~85 px below centerY: centerY over ~1400 puts it in the platform's caption band.
  - keywordAt under 0.18 slams the keyword in on frame 0 before the lead-in; over ~1.6 s at the 2.4 s length leaves it
    on screen for less than 0.6 s before the exit at data-duration − 0.2.
  - The mascot (200 px) stands on the keyword's top-left (x 70–270), or on the lead-in when a long lead reaches that
    far: centerY under ~450 pushes it out of the frame.
-->
<html lang="en" data-composition-variables='[
  {"id": "lead", "type": "string", "label": "Lead-in words", "default": "one of the"},
  {"id": "keyword", "type": "string", "label": "Keyword", "default": "Best ways"},
  {"id": "accent", "type": "color", "label": "Keyword colour", "default": "#E4F53B"},
  {"id": "size", "type": "number", "label": "Keyword size (px; a long keyword shrinks to fit the width)", "default": 150},
  {"id": "centerY", "type": "number", "label": "Vertical centre (px)", "default": 1180},
  {"id": "keywordAt", "type": "number", "label": "Keyword lands at (s)", "default": 0.45},
  {"id": "text", "type": "color", "label": "Lead-in colour", "default": "#FFFFFF"},
  {"id": "headingFont", "type": "font", "label": "Heading font (empty keeps the design font)", "default": ""},
  {"id": "bodyFont", "type": "font", "label": "Body font (empty keeps the design font)", "default": ""},
  {"id": "mascot", "type": "image", "label": "Mascot picture (bin/graphic copies the brand pose; empty hides it)", "default": ""},
  {"id": "pose", "type": "string", "label": "Brand mascot pose (--set pose=thinking)", "default": "default"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      :root { --heading-font: "Helvetica Neue"; --body-font: Georgia; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1080px; height: 1920px; }
      #group { position: absolute; left: 60px; right: 60px; display: flex; flex-direction: column; align-items: center; }
      #lead { font-family: var(--body-font), "Times New Roman", serif; font-size: 58px; color: var(--text); letter-spacing: -0.01em;
        text-shadow: 0 3px 14px rgba(0, 0, 0, 0.55); margin-bottom: -18px; align-self: flex-end; margin-right: 150px; }
      #keyword { font-family: var(--heading-font), Arial, sans-serif; font-weight: 800; font-size: 150px; line-height: 1;
        letter-spacing: -0.045em; text-shadow: 0 6px 24px rgba(0, 0, 0, 0.45); white-space: nowrap; text-align: center; }
      #mascot { position: absolute; left: 10px; width: 200px; height: 200px; object-fit: contain; object-position: 50% 100%;
        transform-origin: 50% 100%; display: none; filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.45)); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2.4" data-width="1080" data-height="1920">
      <div id="group"><div id="lead"></div><div id="keyword"></div><img id="mascot" alt="" /></div>
    </div>
    <script>
      const v = window.__hyperframes.getVariables();
      // Brand look (bin/graphic fills accent, background, text, secondary and the fonts from the project's brand). A
      // font is a family or PostScript name on this Mac, System-<Weight> (San Francisco) or a font file in this folder.
      const look = document.documentElement.style;
      for (const key of ["accent", "background", "text", "secondary"]) if (v[key]) look.setProperty(`--${key}`, v[key]);
      const faces = document.createElement("style");
      for (const [key, slot] of [["headingFont", "--heading-font"], ["bodyFont", "--body-font"]]) {
        const name = String(v[key] ?? "").trim();
        if (!name) continue;
        const file = /\.(ttf|otf|woff2?)$/i.test(name);
        if (!name.startsWith("System-")) faces.textContent += `@font-face { font-family: "${key}"; src: ${file ? `url("${name}")` : `local("${name}")`}; }`;
        look.setProperty(slot, name.startsWith("System-") ? "system-ui" : file ? `"${key}"` : `"${name}", "${key}"`);
      }
      document.head.appendChild(faces);
      document.getElementById("lead").textContent = v.lead;
      const keyword = document.getElementById("keyword");
      keyword.textContent = v.keyword;
      keyword.style.color = v.accent;
      // A keyword wider than the frame shrinks to one line (room for the pop's overshoot); past two thirds of its size
      // it wraps to two lines at that size instead of shrinking further.
      const size = Math.max(40, Number(v.size) || 150);
      const room = 900;
      function fitKeyword() {
        keyword.style.whiteSpace = "nowrap";
        keyword.style.lineHeight = "";
        keyword.style.fontSize = `${size}px`;
        const width = keyword.scrollWidth;
        if (width <= room) return;
        const fitted = Math.floor(size * room / width);
        if (fitted >= Math.round(size * 2 / 3)) {
          keyword.style.fontSize = `${fitted}px`;
          return;
        }
        keyword.style.fontSize = `${Math.round(size * 2 / 3)}px`;
        keyword.style.whiteSpace = "normal";
        keyword.style.lineHeight = "1.08";
        keyword.style.maxWidth = `${room}px`;
      }
      // The brand's mascot (a pose bin/graphic copied in) stands on the keyword's top-left, or on the lead-in when the
      // lead reaches over it; it leaves with the group.
      const mascot = document.getElementById("mascot");
      const lead = document.getElementById("lead");
      function placeMascot() {
        const over = lead.offsetLeft < 10 + 200 + 16 && lead.textContent.trim();
        mascot.style.top = `${(over ? lead.offsetTop : keyword.offsetTop + 12) - 200}px`;
      }
      function layout() {
        fitKeyword();
        if (v.mascot) placeMascot();
      }
      layout();
      // A font that loads after this script changes the widths; fit again (no timing changes).
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
      const group = document.getElementById("group");
      group.style.top = `${v.centerY - 110}px`;
      // Every frame is a pure function of time: one paused timeline, no clocks or random.
      // The exit lands on the composition's end, so a render stretched to a span (bin/graphic plan sets
      // data-duration) holds until then.
      const END = Number(document.querySelector('[data-composition-id="main"]').dataset.duration);
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#lead", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.25, ease: "power2.out" }, 0);
      tl.fromTo("#keyword", { opacity: 0, scale: 0.55 }, { opacity: 1, scale: 1, duration: 0.18, ease: "back.out(2.2)" },
        Math.max(0, v.keywordAt - 0.18));
      if (v.mascot) {
        mascot.src = v.mascot;
        mascot.style.display = "block";
        tl.fromTo(mascot, { scale: 0, y: 30, rotation: -8 }, { scale: 1, y: 0, rotation: 0, duration: 0.3, ease: "back.out(2.2)" },
          Math.max(0, v.keywordAt - 0.05));
      }
      tl.to("#group", { opacity: 0, y: -20, duration: 0.2, ease: "power2.in" }, END - 0.2);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
